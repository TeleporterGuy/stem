# The deployment, made testable on a laptop. NOT for a server.
#
# `docker compose -f docker-compose.yml -f deploy/docker-compose.test.yml` is what
# scripts/server-boot.mjs runs: the real Dockerfile, the real Caddyfile, the real
# socket between them — with only the three things a machine that owns no domain
# cannot have changed.
#
# Keeping these in a file of their own rather than in the script is deliberate.
# What is under test has to be the compose file an operator actually runs, and a
# harness that assembles its own version of it tests the harness.
services:
  stem:
    # A container that keeps restarting hides the boot failure the tripwire
    # exists to catch.
    restart: 'no'
    environment:
      # The scripted FakeBackend, exactly as the non-containerized half of
      # scripts/server-boot.mjs uses it: no pi spawn, no model, no network. What
      # is under test here is the packaging and the socket, not the assistant.
      STEM_E2E: '1'

  caddy:
    restart: 'no'
    environment:
      # No domain, so no certificate: `http://` is a site address matching every
      # Host on port 80. Production uses the bare hostname, which is what turns
      # automatic TLS on.
      #
      # Catch-all rather than a name on purpose — it leaves the Host header
      # unfiltered, so the request with a Host nobody declared reaches Stem and
      # is refused THERE. That refusal (transport/auth.ts's rebinding check,
      # still working from behind a proxy) is one of the things being checked.
      STEM_SITE_ADDRESS: 'http://'
    # !override, not an addition: compose concatenates list entries, and 80/443
    # on a developer's machine are somebody else's.
    ports: !override
      - '127.0.0.1:${STEM_TEST_PORT:-8899}:80'
